name: Qurelio SaaS Production CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Run Test Suite
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: qurelio_test
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql, redis
          coverage: none

      - name: Install Backend Composer Dependencies
        run: |
          cd qurelio-backend
          composer install --no-progress --no-suggest --prefer-dist

      - name: Execute Backend Test Suite (PHPUnit)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: qurelio_test
          DB_USERNAME: root
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
        run: |
          cd qurelio-backend
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan test

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Compile Frontend Assets (Vite)
        run: |
          cd qurelio-frontend
          npm ci
          npm run build

  deploy:
    name: Deploy to Production Server
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: SSH Remote Deployment Action
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/qurelio
            bash deployment/deploy.sh
