# Qurelio Health SaaS - Production Nginx Configuration
# Path: /etc/nginx/sites-available/qurelio.conf

server {
    listen 80;
    listen [::]:80;
    server_name app.qureliohealth.com www.app.qureliohealth.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.qureliohealth.com www.app.qureliohealth.com;

    # SSL Certificates (Managed by Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/app.qureliohealth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.qureliohealth.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # React Frontend Static Build SPA Root
    root /var/www/qurelio/qurelio-frontend/dist;
    index index.html;

    client_max_body_size 50M;

    # Frontend SPA Fallback Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Laravel Backend API Proxy & Handlers
    location /api {
        alias /var/www/qurelio/qurelio-backend/public;
        try_files $uri $uri/ @backend_api;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/qurelio/qurelio-backend/public/index.php;
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_index index.php;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }
    }

    location @backend_api {
        rewrite /api/(.*)$ /index.php?/$1 last;
    }

    # Direct access to Laravel storage uploads
    location /storage {
        alias /var/www/qurelio/qurelio-backend/storage/app/public;
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Block access to hidden files (.env, .git)
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/qurelio_access.log;
    error_log /var/log/nginx/qurelio_error.log warn;
}
