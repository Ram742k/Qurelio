# Qurelio SaaS - Supervisor Worker & Horizon Configuration
# Path: /etc/supervisor/conf.d/horizon.conf

[program:qurelio-horizon]
process_name=%(program_name)s
command=php /var/www/qurelio/qurelio-backend/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/qurelio/qurelio-backend/storage/logs/horizon.log
stopwaitsecs=3600

[program:qurelio-scheduler]
process_name=%(program_name)s
command=bash -c "while [ true ]; do php /var/www/qurelio/qurelio-backend/artisan schedule:run --verbose; sleep 60; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/qurelio/qurelio-backend/storage/logs/scheduler.log
